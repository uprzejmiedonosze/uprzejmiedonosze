# Production nginx blocks that proxy /cdn2/ to Hetzner Object Storage.
#
# During migration: try_files serves existing local files from disk first,
# falling back to S3 for new uploads. After migration is complete, replace
# both blocks with the simpler direct-proxy variant at the bottom of this file.
#
# Include inside the server {} block instead of the existing `location ^~ /cdn2/`:
#   include /path/to/nginx.s3-cdn2.location.conf;
#
# NOTE: proxy_pass in a named location (@s3) cannot contain a URI path,
# so the bucket name must be part of the hostname (virtual-hosted style):
#   /cdn2/12/abc,ca,t.jpg → https://ud-cdn.nbg1.your-objectstorage.com/cdn2/12/abc,ca,t.jpg

# -- PRODUCTION: migration phase (try local disk first, fall back to S3) --

location ^~ /cdn2/ {
    try_files $uri @s3;
    root      $CDN_ROOT;
    expires   max;
    access_log off;
}

location ^~ /cdn2stg/ {                                                                                                                                                                                                                                                                                             
    try_files $uri @s3;                                                                                                                                                                                                                                                                                             
    root      $CDN_ROOT_STG;  # lub ten sam CDN_ROOT jeśli mount jest pod cdn2stg/                                                                                                                                                                                                                                  
    expires   max;                                                                                                                                                                                                                                                                                                  
    access_log off;
  }     

location @s3 {
    proxy_pass         https://ud-cdn.nbg1.your-objectstorage.com;
    proxy_set_header   Host ud-cdn.nbg1.your-objectstorage.com;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    expires            max;
    access_log         off;
    add_header         Cache-Control "public, immutable";
}

