# Production nginx location block that proxies /cdn2/ to Hetzner Object Storage.
#
# Replace BUCKET_NAME and REGION with actual values (e.g. ud-cdn / fsn1).
# Include this file inside the server {} block of the production nginx config
# *instead of* the existing `location ^~ /cdn2/` block that serves from disk:
#
#   include /var/www/uprzejmiedonosze.net/webapp/nginx.s3-cdn2.location.conf;
#
# The object key in S3 mirrors the URL path, so:
#   /cdn2/12/abc,ca,t.jpg  →  https://BUCKET_NAME.REGION.your-objectstorage.com/cdn2/12/abc,ca,t.jpg

location ^~ /cdn2/ {
    proxy_pass         https://BUCKET_NAME.REGION.your-objectstorage.com;
    proxy_set_header   Host BUCKET_NAME.REGION.your-objectstorage.com;
    proxy_set_header   Connection "";
    proxy_http_version 1.1;

    proxy_buffering    on;
    proxy_cache_valid  200 365d;

    expires            max;
    access_log         off;
    add_header         Cache-Control "public, immutable";
}
