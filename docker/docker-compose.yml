services:
  firebase-emulator:
    image: firebase-emulator
    build:
      context: ..
      dockerfile: docker/Dockerfile.firebase
    container_name: firebase-emulator
    ports:
      - 9099:9099
      - 4000:4000
    restart: always

  webapp:
    image: webapp
    build:
      context: .
    container_name: webapp
    ports:
      - 80-81:80-81
    restart: always
    working_dir: /var/www/localhost/webapp
    volumes:
      - ../export:/var/www/localhost/webapp
    depends_on:
      - firebase-emulator
    environment:
        WATCHPACK_POLLING: "true"
        FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulator:9099"

  matomo-db:
    image: mariadb:11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo_db_pass
      MYSQL_ROOT_PASSWORD: matomo_root_pass
    volumes:
      - matomo-db-data:/var/lib/mysql

  matomo:
    image: matomo:apache
    container_name: matomo
    restart: always
    depends_on:
      - matomo-db
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo_db_pass
    volumes:
      - matomo-data:/var/www/html

volumes:
  matomo-db-data:
  matomo-data:
