services:

  # ── DEV ─────────────────────────────────────────────────────────────────
  firebase-emulator:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile.firebase
    container_name: firebase-emulator
    ports:
      - 9099:9099
      - 4000:4000
    restart: always

  memcached:
    profiles: [dev]
    image: memcached:alpine
    container_name: memcached
    restart: always

  webapp:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: webapp
      args:
        APP_HOST: localhost
        APP_HTTPS: http
    container_name: webapp
    ports:
      - 80-81:80-81
    restart: always
    working_dir: /var/www/uprzejmiedonosze.net/webapp
    volumes:
      # Dev server root — mirrors prod server layout inside container
      - ../export:/var/www/uprzejmiedonosze.net/webapp
      - ../vendor:/var/www/uprzejmiedonosze.net/vendor
      - ./devroot/db:/var/www/uprzejmiedonosze.net/db
      - ../config.php:/var/www/uprzejmiedonosze.net/webapp/config.php:ro
    depends_on:
      - firebase-emulator
      - memcached
      - face-detector
    environment:
      APP_HOST: localhost
      APP_HTTPS: http
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulator:9099"
      MEMCACHED_HOST: "memcached"

  # ── PROD only ─────────────────────────────────────────────────────────────
  matomo-db:
    profiles: [prod]
    image: mariadb:11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo_db_pass
      MYSQL_ROOT_PASSWORD: matomo_root_pass
    volumes:
      - matomo-db-data:/var/lib/mysql

  matomo:
    profiles: [prod]
    image: matomo:apache
    container_name: matomo
    restart: always
    depends_on:
      - matomo-db
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo_db_pass
    volumes:
      - matomo-data:/var/www/html

  # ── FACE SERVICES (dev + staging + prod) ─────────────────────────────────
  face-detector:
    profiles: [dev, staging, prod]
    build:
      context: ./face-detector
    restart: always
    ports:
      - "127.0.0.1:2000:2000"

  # Single parameterized service — run via:
  #   docker compose --env-file services/.env.prod    -p prod    --profile prod    up -d
  #   docker compose --env-file services/.env.staging -p staging --profile staging up -d
  face-detect-consumer:
    profiles: [staging, prod]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: face-detect-consumer
    restart: always
    network_mode: host
    volumes:
      # APP_DATA_ROOT = host-side server root (varies by env, always /var/www/uprzejmiedonosze.net/ inside)
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}:/var/www/uprzejmiedonosze.net:rw
      - /var/log/${APP_HOST:-uprzejmiedonosze.net}:/var/log/${APP_HOST:-uprzejmiedonosze.net}:rw
    environment:
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      MEMCACHED_HOST: localhost

volumes:
  matomo-db-data:
  matomo-data:
