name: ${APP_ENV:-dev}

# App secrets and environment-specific config — passed to all PHP-running services.
# Staging/prod: vars come from --env-file substitution (services/.env.staging / .env.prod).
# Dev: loaded directly into the webapp container via env_file: .env.dev.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_USER: ${SMTP_USER:-}
  EMAIL_SENDER: ${EMAIL_SENDER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_GMAIL: ${SMTP_GMAIL:-}
  PLATERECOGNIZER_SECRET: ${PLATERECOGNIZER_SECRET:-}
  OPEN_ALPR_SECRET_1: ${OPEN_ALPR_SECRET_1:-}
  OPEN_ALPR_SECRET_2: ${OPEN_ALPR_SECRET_2:-}
  MAPBOX_API_TOKEN: ${MAPBOX_API_TOKEN:-}
  GOOGLE_MAPS_API_TOKEN: ${GOOGLE_MAPS_API_TOKEN:-}
  PATRONITE_TOKEN: ${PATRONITE_TOKEN:-}
  MAILER_DSN: ${MAILER_DSN:-}
  MAILER_FROM: ${MAILER_FROM:-}
  MAILER_WEBHOOK_SECRET: ${MAILER_WEBHOOK_SECRET:-}
  MAILER_DSN_ALTER: ${MAILER_DSN_ALTER:-}
  MAILER_FROM_ALTER: ${MAILER_FROM_ALTER:-}
  CRYPTO_KEY: ${CRYPTO_KEY:-}
  CRYPTO_IV: ${CRYPTO_IV:-}
  CRYPTO_TAG: ${CRYPTO_TAG:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  OPENAI_PROJECT: ${OPENAI_PROJECT:-}
  MATOMO_SITE_ID: ${MATOMO_SITE_ID:-1}
  BACKEND_API_KEY: ${BACKEND_API_KEY:-}
  CORS_ALLOWED_DOMAIN: ${CORS_ALLOWED_DOMAIN:-}
  S3_KEY: ${S3_KEY:-}
  S3_SECRET: ${S3_SECRET:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}

services:

  # ── DEV ─────────────────────────────────────────────────────────────────
  firebase-emulator:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile.firebase
    container_name: firebase-emulator
    ports:
      - 9099:9099
      - 4000:4000
    restart: always

  builder:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: builder
      args:
        APP_HOST: localhost
        APP_HTTPS: http
    container_name: builder
    volumes:
      - ../.parcelrc:/build/.parcelrc:ro
      - ../src:/build/src:ro
      - ../tools:/build/tools:ro
      - ../export:/build/export
      - ./webapp/watch.sh:/watch.sh:ro
    environment:
      APP_HOST: localhost
      APP_HTTPS: http
    command: ["sh", "/watch.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/build/export/public/index.php"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s

  webapp:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: webapp
      args:
        APP_HOST: localhost
        APP_HTTPS: http
    container_name: webapp
    ports:
      - 80-81:80-81
    restart: always
    working_dir: /var/www/uprzejmiedonosze.net/webapp
    volumes:
      - ../export:/var/www/uprzejmiedonosze.net/webapp
      - ./devroot/db:/var/www/uprzejmiedonosze.net/db
    env_file:
      - .env.dev
    depends_on:
      builder:
        condition: service_healthy
      firebase-emulator:
        condition: service_started
      memcached:
        condition: service_started
    environment:
      APP_HOST: localhost
      APP_HTTPS: http
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulator:9099"
      MEMCACHED_HOST: "memcached"

  # ── STAGING + PROD ────────────────────────────────────────────────────────
  # Run via:
  #   docker compose --env-file services/.env.staging -p staging --profile staging up -d
  #   docker compose --env-file services/.env.prod    -p prod    --profile prod    up -d
  webapp-srv:
    profiles: [staging, prod]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: webapp
      args:
        APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
        APP_HTTPS: ${APP_HTTPS:-https}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    restart: always
    volumes:
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}db:/var/www/uprzejmiedonosze.net/db:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2:/var/www/uprzejmiedonosze.net/cdn2:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2stg:/var/www/uprzejmiedonosze.net/cdn2stg:rw
      - /var/log/${APP_HOST:-uprzejmiedonosze.net}:/var/log/uprzejmiedonosze.net:rw
    depends_on:
      - memcached
      - face-detector
    environment:
      <<: *app-env
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      APP_HTTPS: ${APP_HTTPS:-https}
      MEMCACHED_HOST: memcached

  # ── PROD only ─────────────────────────────────────────────────────────────
  matomo-db:
    profiles: [prod]
    image: mariadb:11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo_db_pass
      MYSQL_ROOT_PASSWORD: matomo_root_pass
    volumes:
      - matomo-db-data:/var/lib/mysql

  matomo:
    profiles: [prod]
    image: matomo:apache
    container_name: matomo
    restart: always
    depends_on:
      - matomo-db
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo_db_pass
    volumes:
      - matomo-data:/var/www/html

  # ── SHARED: dev + staging + prod ─────────────────────────────────────────
  memcached:
    profiles: [dev, staging, prod]
    image: memcached:alpine
    restart: always

  face-detector:
    profiles: [staging, prod]
    build:
      context: ./face-detector
    restart: always

  # face-detect-consumer and worker-cron share the worker image (code baked in from builder).
  # Only runtime data is mounted: db/, cdn2*, logs. Config comes from environment vars.
  face-detect-consumer:
    profiles: [staging, prod]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: worker
    restart: always
    depends_on:
      - memcached
      - face-detector
    volumes:
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}db:/var/www/uprzejmiedonosze.net/db:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2:/var/www/uprzejmiedonosze.net/cdn2:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2stg:/var/www/uprzejmiedonosze.net/cdn2stg:rw
      - /var/log/${APP_HOST:-uprzejmiedonosze.net}:/var/log/uprzejmiedonosze.net:rw
    environment:
      <<: *app-env
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      MEMCACHED_HOST: memcached
      FACE_DETECTOR_URL: http://face-detector:2000
    command: ["nice", "-n", "10", "php", "/var/www/uprzejmiedonosze.net/webapp/tools/face-detect-consumer.php"]

  worker-cron:
    profiles: [staging, prod]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: worker
    restart: always
    volumes:
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}db:/var/www/uprzejmiedonosze.net/db:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2:/var/www/uprzejmiedonosze.net/cdn2:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2stg:/var/www/uprzejmiedonosze.net/cdn2stg:rw
      - /var/log/${APP_HOST:-uprzejmiedonosze.net}:/var/log/uprzejmiedonosze.net:rw
    depends_on:
      - memcached
    environment:
      <<: *app-env
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      MEMCACHED_HOST: memcached
    command: ["supercronic", "/etc/crontab"]

volumes:
  matomo-db-data:
  matomo-data:
