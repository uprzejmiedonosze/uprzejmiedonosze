services:

  # ── DEV ─────────────────────────────────────────────────────────────────
  firebase-emulator:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile.firebase
    container_name: firebase-emulator
    ports:
      - 9099:9099
      - 4000:4000
    restart: always

  memcached:
    profiles: [dev]
    image: memcached:alpine
    container_name: memcached
    restart: always

  webapp:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
    container_name: webapp
    ports:
      - 80-81:80-81
    restart: always
    working_dir: /var/www/localhost/webapp
    volumes:
      - ../export:/var/www/localhost/webapp
    depends_on:
      - firebase-emulator
      - memcached
    environment:
      WATCHPACK_POLLING: "true"
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulator:9099"
      MEMCACHED_HOST: "memcached"

  matomo-db:
    profiles: [matomo]
    image: mariadb:11
    container_name: matomo-db
    restart: always
    environment:
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo_db_pass
      MYSQL_ROOT_PASSWORD: matomo_root_pass
    volumes:
      - matomo-db-data:/var/lib/mysql

  matomo:
    profiles: [matomo]
    image: matomo:apache
    container_name: matomo
    restart: always
    depends_on:
      - matomo-db
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_DBNAME: matomo
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo_db_pass
    volumes:
      - matomo-data:/var/www/html

  # ── FACE SERVICES ────────────────────────────────────────────────────────
  face-detector:
    profiles: [staging, prod]
    build:
      context: ./face-detector
    restart: always
    ports:
      - "127.0.0.1:2000:2000"

  face-detect-consumer-prod:
    profiles: [prod]
    build:
      context: ..
      dockerfile: services/face-detect-consumer/Dockerfile
    restart: always
    network_mode: host
    volumes:
      - /var/www/uprzejmiedonosze.net/db:/app/db:rw
      - /var/www/uprzejmiedonosze.net/webapp/config.prod.php:/app/webapp/config.prod.php:ro
      - /var/log/uprzejmiedonosze.net:/var/log/uprzejmiedonosze.net:rw
    environment:
      APP_HOST: uprzejmiedonosze.net
      APP_ROOT: /app/
      MEMCACHED_HOST: localhost

  face-detect-consumer-staging:
    profiles: [staging]
    build:
      context: ..
      dockerfile: services/face-detect-consumer/Dockerfile
    restart: always
    network_mode: host
    volumes:
      - /var/www/staging.uprzejmiedonosze.net/db:/app/db:rw
      - /var/www/staging.uprzejmiedonosze.net/webapp/config.php:/app/webapp/config.php:ro
      - /var/log/staging.uprzejmiedonosze.net:/var/log/staging.uprzejmiedonosze.net:rw
    environment:
      APP_HOST: staging.uprzejmiedonosze.net
      APP_ROOT: /app/
      MEMCACHED_HOST: localhost

volumes:
  matomo-db-data:
  matomo-data:
