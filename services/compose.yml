name: ${APP_ENV:-uprzejmiedonosze-dev}

networks:
  # Only webapp-srv joins this — it's the only service that needs public
  # HTTPS routing (../edge's Traefik). worker-cron/face-detect-consumer/
  # face-detector stay on the default project network, reached by service
  # name as today. Created externally by ../edge (see its CLAUDE.md); this
  # project never creates or owns it.
  edge:
    external: true

# App secrets and environment-specific config.
# Staging/prod: vars from --env-file (services/.env.staging / .env.prod) via x-app-env.
# Dev: committed config.dev.php (mounted into webapp/builder) + optional services/.env.dev for extras.
x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_USER: ${SMTP_USER:-}
  EMAIL_SENDER: ${EMAIL_SENDER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_GMAIL: ${SMTP_GMAIL:-}
  PLATERECOGNIZER_SECRET: ${PLATERECOGNIZER_SECRET:-}
  OPEN_ALPR_SECRET_1: ${OPEN_ALPR_SECRET_1:-}
  OPEN_ALPR_SECRET_2: ${OPEN_ALPR_SECRET_2:-}
  MAPBOX_API_TOKEN: ${MAPBOX_API_TOKEN:-}
  GOOGLE_MAPS_API_TOKEN: ${GOOGLE_MAPS_API_TOKEN:-}
  PATRONITE_TOKEN: ${PATRONITE_TOKEN:-}
  API_TOKEN: ${API_TOKEN:-}
  TUMBLR_CONSUMERKEY: ${TUMBLR_CONSUMERKEY:-}
  TUMBLR_CONSUMERSECRET: ${TUMBLR_CONSUMERSECRET:-}
  TUMBLR_TOKEN: ${TUMBLR_TOKEN:-}
  TUMBLR_SECRET: ${TUMBLR_SECRET:-}
  MAILER_DSN: ${MAILER_DSN:-}
  MAILER_FROM: ${MAILER_FROM:-}
  MAILER_WEBHOOK_SECRET: ${MAILER_WEBHOOK_SECRET:-}
  MAILER_DSN_ALTER: ${MAILER_DSN_ALTER:-}
  MAILER_FROM_ALTER: ${MAILER_FROM_ALTER:-}
  CRYPTO_KEY: ${CRYPTO_KEY:-}
  CRYPTO_IV: ${CRYPTO_IV:-}
  CRYPTO_TAG: ${CRYPTO_TAG:-}
  OAUTH_PRIVATE_KEY: ${OAUTH_PRIVATE_KEY:-}
  OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  OPENAI_PROJECT: ${OPENAI_PROJECT:-}
  MATOMO_SITE_ID: ${MATOMO_SITE_ID:-1}
  BACKEND_API_KEY: ${BACKEND_API_KEY:-}
  CORS_ALLOWED_DOMAIN: ${CORS_ALLOWED_DOMAIN:-}
  B2_KEY: ${B2_KEY:-}
  B2_SECRET: ${B2_SECRET:-}
  B2_BUCKET: ${B2_BUCKET:-}
  B2_ENDPOINT: ${B2_ENDPOINT:-}
  B2_REGION: ${B2_REGION:-}
  BACKUP_B2_KEY: ${BACKUP_B2_KEY:-}
  BACKUP_B2_SECRET: ${BACKUP_B2_SECRET:-}
  BACKUP_B2_BUCKET: ${BACKUP_B2_BUCKET:-}
  AGE_RECIPIENT: ${AGE_RECIPIENT:-}

services:

  # ── DEV ─────────────────────────────────────────────────────────────────
  firebase-emulator:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile.firebase
    container_name: firebase-emulator
    ports:
      - 9099:9099
      - 4000:4000
    restart: always
    # Run under an init so the Java/Node emulator reaps children and stops
    # cleanly; without it the container often wedges ("cannot stop") on WSL.
    init: true

  mailpit:
    profiles: [dev]
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - 8025:8025
      - 1025:1025
    restart: always

  # Relays Firebase Auth Emulator OOB links (sign-in/reset) into Mailpit, since
  # the emulator never sends real email. Gives dev a prod-like sign-in flow:
  # the message lands in http://localhost:8025 with a clickable link.
  firebase-mail-bridge:
    profiles: [dev]
    image: python:3-alpine
    container_name: firebase-mail-bridge
    restart: always
    volumes:
      - ./firebase-mail-bridge/bridge.py:/bridge.py:ro
    environment:
      EMULATOR_HOST: "firebase-emulator:9099"
      FIREBASE_PROJECT: "demo-project"
      BRIDGE_SMTP_HOST: "mailpit"
      BRIDGE_SMTP_PORT: "1025"
    command: ["python", "/bridge.py"]
    depends_on:
      firebase-emulator:
        condition: service_started
      mailpit:
        condition: service_started

  builder:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: builder
      args:
        APP_HOST: localhost
        APP_HTTPS: http
    container_name: builder
    volumes:
      - ../.parcelrc:/build/.parcelrc:ro
      - ../src:/build/src:ro
      - ../tests:/build/tests:ro
      - ../tools:/build/tools:ro
      - ../export:/build/export
      - ../config.dev.php:/build/config.dev.php:ro
      - ./webapp/watch.sh:/watch.sh:ro
    environment:
      APP_HOST: localhost
      APP_HTTPS: http
    command: ["sh", "/watch.sh"]
    healthcheck:
      test: ["CMD", "test", "-f", "/build/export/public/index.php"]
      interval: 2s
      timeout: 3s
      retries: 90
      start_period: 10s

  # PHPUnit runner for `make test`, independent of the dev stack: no fixed
  # container_name (so it can run while `make dev` is up) and no ../export
  # mount (builds its own PHP-only export inside the throwaway container
  # instead of racing the dev builder's watch.sh over the shared directory).
  builder-test:
    profiles: [test]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: builder
      args:
        APP_HOST: localhost
        APP_HTTPS: http
    volumes:
      - ../src:/build/src:ro
      - ../tests:/build/tests:ro
      - ../tools:/build/tools:ro
      - ../config.dev.php:/build/config.dev.php:ro
      - ./webapp/watch.sh:/watch.sh:ro
    env_file:
      - path: .env.dev
        required: false
    environment:
      APP_HOST: localhost
      APP_HTTPS: http
      APP_ENV: staging
      MEMCACHED_HOST: memcached
      TEST_DB: /tmp/run-test-db.sqlite
    command: ["sh", "-c", "sh /watch.sh --once && cp /tmp/test-db.sqlite $$TEST_DB && ./vendor/bin/phpunit --display-deprecations tests"]
    depends_on:
      - memcached

  webapp:
    profiles: [dev]
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: webapp
      args:
        APP_HOST: localhost
        APP_HTTPS: http
    container_name: webapp
    ports:
      - 80-81:80-81
    restart: always
    working_dir: /var/www/uprzejmiedonosze.net/webapp
    volumes:
      - ../export:/var/www/uprzejmiedonosze.net/webapp
      - ../config.dev.php:/var/www/uprzejmiedonosze.net/webapp/config.dev.php:ro
      - ./devroot/db:/var/www/uprzejmiedonosze.net/db
    env_file:
      - path: .env.dev
        required: false
      - path: .env.dev.local  # gitignored local secrets, e.g. ALPR keys
        required: false
    depends_on:
      builder:
        condition: service_healthy
      firebase-emulator:
        condition: service_started
      mailpit:
        condition: service_started
      memcached:
        condition: service_started
    environment:
      APP_ENV: dev
      APP_HOST: localhost
      APP_HTTPS: http
      FIREBASE_AUTH_EMULATOR_HOST: "firebase-emulator:9099"
      MEMCACHED_HOST: "memcached"

  # ── STAGING + PROD + SHADOW ─────────────────────────────────────────────────
  # Run via:
  #   docker compose --env-file services/.env.staging -p staging --profile staging up -d
  #   docker compose --env-file services/.env.prod    -p prod    --profile prod    up -d
  #   docker compose --env-file services/.env.shadow  -p shadow  --profile shadow  up -d
  webapp-srv:
    profiles: [staging, prod, shadow]
    image: ${REGISTRY:-ghcr.io/uprzejmiedonosze/uprzejmiedonosze}/webapp:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: webapp
      args:
        APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
        APP_HTTPS: ${APP_HTTPS:-https}
    # 127.0.0.1:${APP_PORT} is test-only (curl'd directly before the ../edge
    # cutover, see the plan) — public traffic arrives via Traefik on the
    # `edge` network, wired below through labels. Set APP_PORT=18080 (prod)
    # / 18081 (staging) in the respective .env.* — the old default 8080
    # collides with edge's own Traefik dashboard port on the same host.
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:80"
    restart: always
    networks:
      - default
      - edge
    # List form, not mapping form: compose only interpolates ${...} inside a
    # label's *value*, never inside a mapping *key* — with the map form
    # below, `traefik.http.routers.ud-${APP_ENV:-prod}...:` would keep the
    # literal, unexpanded string "ud-${APP_ENV:-prod}" as the router name for
    # BOTH profiles, colliding staging with prod on the same Traefik instance
    # (confirmed via `docker compose config` while writing this). List form
    # holds the whole "key=value" as one scalar, so interpolation runs over
    # both halves before the `=` split.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      # ${TRAEFIK_ENV} (default ${APP_ENV}: prod/staging) namespaces the router
      # so multiple projects can run on the same Traefik instance without
      # colliding. Shadow keeps APP_ENV=prod on purpose (PHP must see a full
      # prod behavior — isProd() gates real email sending to SM — see
      # Mail.php), so .env.shadow overrides TRAEFIK_ENV=shadow instead;
      # nested ${VAR:-${VAR2}} interpolation confirmed working (Compose v5).
      # www redirect is prod-only (staging/shadow never had a www. alias) —
      # TRAEFIK_EXTRA_HOST_RULE (.env.prod) appends
      # ` || Host(\`www.uprzejmiedonosze.net\`)`, backed by a
      # redirect-www@file middleware (see ../edge/traefik/dynamic.local).
      # TRAEFIK_EXTRA_MIDDLEWARES (.env.staging) points at a geoblock
      # middleware instead. Both default to empty — no extra host / no
      # middlewares — until those per-host files exist (Faza 1).
      - "traefik.http.routers.ud-${TRAEFIK_ENV:-${APP_ENV:-prod}}.rule=Host(`${APP_HOST:-uprzejmiedonosze.net}`)${TRAEFIK_EXTRA_HOST_RULE:-}"
      - "traefik.http.routers.ud-${TRAEFIK_ENV:-${APP_ENV:-prod}}.entrypoints=websecure"
      - "traefik.http.routers.ud-${TRAEFIK_ENV:-${APP_ENV:-prod}}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ud-${TRAEFIK_ENV:-${APP_ENV:-prod}}.middlewares=${TRAEFIK_EXTRA_MIDDLEWARES:-}"
      - "traefik.http.services.ud-${TRAEFIK_ENV:-${APP_ENV:-prod}}.loadbalancer.server.port=80"
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: "{{.Name}}"
    volumes:
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}db:/var/www/uprzejmiedonosze.net/db:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2:/var/www/uprzejmiedonosze.net/cdn2:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2stg:/var/www/uprzejmiedonosze.net/cdn2stg:rw
      # Firebase Admin SDK service account — deliberately excluded from the
      # image (.dockerignore: *firebase-adminsdk.json, it's a secret), so it
      # has to be bind-mounted at runtime instead. Filename is HOST-derived
      # (AuthMiddleware.php/FirebaseToken.php: HOST . '-firebase-adminsdk.json',
      # read from webapp/ two levels up from inc/middleware or inc/passkey),
      # so ${APP_HOST} must match on both sides even though the container's
      # own APP_ROOT is always /var/www/uprzejmiedonosze.net/ regardless of
      # profile. Only webapp-srv needs it (AuthMiddleware/PasskeyHandler are
      # HTTP-only; no tools/cron script touches Firebase Admin).
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}webapp/${APP_HOST:-uprzejmiedonosze.net}-firebase-adminsdk.json:/var/www/uprzejmiedonosze.net/webapp/${APP_HOST:-uprzejmiedonosze.net}-firebase-adminsdk.json:ro
      # Host's journald socket — app (Logger.php) and nginx (error_log.conf,
      # generated by init.sh) write log lines here directly as syslog
      # datagrams with a real PRI, so severity survives into Papertrail
      # instead of being flattened to stdout=INFO/stderr=ERROR by the
      # container's own `logging: driver: syslog` below (see AGENTS.md §
      # Logging). Mounted as a directory, not the socket file itself — a
      # journald restart recreates the socket inode, which would leave a
      # file-level bind mount pointing at a stale, dead inode.
      - /run/systemd/journal:/run/systemd/journal:ro
    # No depends_on: webapp-srv functionally uses neither face-detector
    # (its declared-but-unused dependency here, see scripts/deploy.sh) nor
    # memcached's *startup* — and with face-detector left out of the shadow
    # profile, a depends_on would make the whole shadow project invalid
    # ("depends on undefined service", Compose rejects at config stage).
    # Memcached is always named explicitly by scripts/deploy.sh instead;
    # prod's face-detector still gets started via face-detect-consumer's
    # own depends_on.
    environment:
      <<: *app-env
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      APP_HTTPS: ${APP_HTTPS:-https}
      MEMCACHED_HOST: memcached
      LOG_IDENT: ${LOG_IDENT:-${APP_ENV:-prod}-webapp-srv}

  # ── SHARED: dev + staging + prod + shadow ─────────────────────────────────
  # Each compose project gets its own memcached (separate container per
  # project), so shadow's sessions stay isolated from prod's.
  memcached:
    profiles: [dev, staging, prod, test, shadow]
    image: memcached:alpine
    restart: always

  face-detector:
    profiles: [staging, prod]
    image: ${REGISTRY:-ghcr.io/uprzejmiedonosze/uprzejmiedonosze}/face-detector:${FACE_DETECTOR_TAG:-latest}
    build:
      context: ./face-detector
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: "{{.Name}}"

  # face-detect-consumer and worker-cron share the worker image (code baked in from builder).
  # Only runtime data is mounted: db/, cdn2*, logs. Config comes from environment vars.
  face-detect-consumer:
    profiles: [staging, prod]
    image: ${REGISTRY:-ghcr.io/uprzejmiedonosze/uprzejmiedonosze}/worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: worker
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: "{{.Name}}"
    depends_on:
      - memcached
      - face-detector
    volumes:
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}db:/var/www/uprzejmiedonosze.net/db:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2:/var/www/uprzejmiedonosze.net/cdn2:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2stg:/var/www/uprzejmiedonosze.net/cdn2stg:rw
      # Host's journald socket — see webapp-srv's copy of this comment above.
      - /run/systemd/journal:/run/systemd/journal:ro
    environment:
      <<: *app-env
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      MEMCACHED_HOST: memcached
      FACE_DETECTOR_URL: http://face-detector:2000
      LOG_IDENT: ${APP_ENV:-prod}-face-detect-consumer
    command: ["nice", "-n", "10", "php", "/var/www/uprzejmiedonosze.net/webapp/tools/face-detect-consumer.php"]
    # `nice` execs into `php`, so PHP ends up running as PID 1 here too — same
    # category of risk as worker-cron's supercronic (see its comment below).
    # Not empirically confirmed broken for this specific process, but the fix
    # is free and the failure mode (unreaped zombies / broken signal
    # handling) is exactly the kind of thing that's silent until it isn't.
    init: true

  worker-cron:
    profiles: [staging, prod]
    image: ${REGISTRY:-ghcr.io/uprzejmiedonosze/uprzejmiedonosze}/worker:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: services/webapp/Dockerfile
      target: worker
    restart: always
    logging:
      driver: syslog
      options:
        syslog-address: "unixgram:///dev/log"
        tag: "{{.Name}}"
    volumes:
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}db:/var/www/uprzejmiedonosze.net/db:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2:/var/www/uprzejmiedonosze.net/cdn2:rw
      - ${APP_DATA_ROOT:-/var/www/uprzejmiedonosze.net/}cdn2stg:/var/www/uprzejmiedonosze.net/cdn2stg:rw
      - ${BACKUP_TMP_ROOT:-/mnt/hotbackup/tmp}:/mnt/hotbackup/tmp:rw
      # Host's journald socket — see webapp-srv's copy of this comment above.
      - /run/systemd/journal:/run/systemd/journal:ro
    depends_on:
      - memcached
    environment:
      <<: *app-env
      APP_HOST: ${APP_HOST:-uprzejmiedonosze.net}
      MEMCACHED_HOST: memcached
      LOG_IDENT: ${APP_ENV:-prod}-worker-cron
    # Without -split-logs, supercronic routes ALL of its own logging to
    # stderr regardless of level — with `logging: driver: syslog` below,
    # Docker's syslog driver maps stream→priority (stdout→info, stderr→err),
    # so every line, including plain "starting"/"job succeeded" ones, was
    # showing up in Papertrail tagged ERROR (confirmed 2026-09-29).
    # -split-logs makes supercronic route by level instead: info to stdout,
    # real failures (non-zero exit, panics) stay on stderr — unlike a
    # blanket `2>&1`, this doesn't also hide genuine job failures as INFO.
    # Unrelated to app-level errors, which Logger.php already sends with a
    # real PRI straight to journald (see "Logging" above), bypassing
    # Docker's stream capture entirely.
    command: ["supercronic", "-split-logs", "/etc/crontab"]
    # supercronic is not designed to run as PID 1 (its own README says so) —
    # confirmed empirically (2026-09-27, this host): as PID 1 it attempts its
    # own zombie-reaping path and immediately fatals with "Failed to fork
    # exec: no such file or directory" (repro'd even with a trivial one-line
    # crontab, kernel 6.12.107). Wrapping it in anything that isn't PID 1
    # (confirmed with `timeout 5 supercronic ...`) fixes it instantly — the
    # log then reads "process reaping disabled, not pid 1" and it runs fine.
    # `init: true` gives it Docker's own docker-init/tini as PID 1, which
    # reaps correctly and disables supercronic's broken internal path.
    init: true

