user  www-data www-data;
worker_processes  auto;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '"$request" $status "$http_referer" "$http_x_forwarded_for" $request_time';

    sendfile        on;

    keepalive_timeout  65;

    # Real client IP for REMOTE_ADDR (Logger.php, PasskeyHandler.php) — the
    # request always arrives via Traefik on the `edge` Docker network, so
    # trust its X-Forwarded-For unconditionally rather than trying to
    # enumerate the network's subnet (it's not fixed across hosts).
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_types text/plain text/css application/x-javascript text/xml application/xml application/xml+rss text/javascript image/x-icon image/bmp image/svg+xml application/javascript;

    upstream php {
        server unix:/run/php/php8.4-fpm.sock;
    }

    # Backblaze B2 fallback for /cdn2/ and /cdn2stg/ — s3-sync.php removes
    # local copies after upload, so older assets 404 locally and must fall
    # through to the bucket. Mirrors the bare-metal vhost 1:1.
    upstream b2_v4 {
        server 45.11.38.254:443;
        server 45.11.39.254:443;
        server 45.11.36.254:443;
        server 45.11.37.254:443;
        keepalive 32;
    }

    proxy_buffering on;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Per-IP rate limiting — real REMOTE_ADDR now that real_ip_module rewrites
    # $remote_addr from Traefik's X-Forwarded-For, so this keys correctly on
    # the actual client rather than the proxy. Mirrors the bare-metal vhost's
    # perip_1s/perip_5m zones; CrowdSec (edge) is the broader defense, this is
    # the app-level backstop that was already tuned to this traffic.
    limit_req_zone $binary_remote_addr zone=perip_1s:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=perip_5m:10m rate=120r/m;
    limit_req_status 429;

    # GET /mcp is the human-facing landing page (main app, session + Twig);
    # every other method is the sessionless MCP JSON-RPC interface for LLM
    # clients. try_files/location only see the URI, not the verb, so the
    # front controller is picked by request method here instead.
    map $request_method $mcp_index {
        default  /api/mcp/index.php;
        GET      /index.php;
    }

    # The real scheme for anything proxied onward (/wiki/) — see that
    # location for why $scheme itself can't be used anymore. Falls back to
    # $scheme when there's no incoming X-Forwarded-Proto (e.g. hit directly
    # without Traefik in front, as in dev).
    map $http_x_forwarded_proto $proxy_x_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;

        etag on;
        gzip_static on;

        # Server-level default, inherited by every location — crucially
        # including the `~ \.php$` block that `try_files ... /index.php...`
        # internally redirects to. Confirmed 2026-09-28 (prod incident):
        # setting client_max_body_size only on the originating regex
        # location (e.g. the /api/app/.../image block below) is a no-op,
        # because nginx re-matches location on that internal redirect and
        # enforces the body-size limit of whichever location ends up
        # actually reading the body (the PHP one) — not the one that first
        # matched the request URI. Without a value here, that PHP location
        # falls back to nginx's compiled-in default of 1m, which silently
        # truncated ~1MB image uploads (base64 JSON body) that the
        # apparent 10m override below never actually protected. Bare-metal
        # never hit this: snippets/proxy.conf set client_max_body_size 5m
        # globally, which this container's nginx.conf never carried over.
        client_max_body_size 10m;
        # Matches client_max_body_size above — without this, nginx's small
        # default in-memory buffer (a few KB) means any image upload spills
        # to a temp file on disk, logging a harmless but noisy
        # "a client request body is buffered to a temporary file" warning
        # on essentially every /api/app/.../image POST (confirmed
        # 2026-09-28, Papertrail noise). Sized to fit the whole allowed
        # body in memory so that warning stops firing for anything within
        # the normal upload size.
        client_body_buffer_size 10m;

        limit_req zone=perip_1s burst=90 nodelay;
        limit_req zone=perip_5m burst=300 nodelay;

        # Only allow these request methods (bare-metal snippets/restrictions.conf parity).
        if ($request_method !~ ^(GET|HEAD|POST|PATCH|OPTIONS|DELETE)$ ) {
            return 444;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # error_log destination is environment-dependent — generated by
        # init.sh into this file before nginx starts (syslog straight to the
        # host's journald socket on staging/prod so severity survives into
        # Papertrail, /dev/stderr fallback everywhere else — see AGENTS.md §
        # Logging). access_log stays on stdout: request lines aren't errors,
        # and the container's `logging: driver: syslog` already tags stdout
        # as INFO correctly.
        include     /etc/nginx/error_log.conf;
        access_log  /dev/stdout main;
        error_page 404 /404.html;

        root /var/www/uprzejmiedonosze.net/webapp/public;

        # Deny dotfiles (.env, .htaccess, …) except /.well-known/, which must
        # stay reachable for traffic-advice/assetlinks.json (and, on the
        # bare-metal host, ACME HTTP-01 — here that's Traefik's job instead).
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
        }

        location ~ ^/xmlrpc.* {
            return 401;
        }

        location ~* \.(gz|sql)$ {
            return 401;
        }

        location = /.well-known/traffic-advice {
            types { } default_type "application/trafficadvice+json; charset=utf-8";
            try_files $uri =404;
        }

        # Static assets — anchored to `$` only (extension anywhere in the
        # path), unlike the bare-metal original this was copied from
        # (`^/(cdn|cdn2|\.(js|css|...))$`), which only ever matched a
        # literal `/cdn`, `/cdn2`, or a dot-prefixed single segment like
        # `/.js` — never real asset paths such as `/js/index3.js` or
        # `/css/index3.css`. Confirmed 2026-09-28: it silently never
        # matched anything on prod, so every JS/CSS/JSON/image request fell
        # through to `location /` and got logged at "main" like a real page
        # view. `/cdn2/` etc. still hit their own `^~` prefix locations
        # first regardless (higher priority than any regex).
        location ~* \.(js|css|json|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|map)$ {
            access_log off;
            expires max;
            try_files $uri =404;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache";
            try_files $uri /index.php$is_args$args;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include nginx_php_configuration.conf;
        }

        location ~* /img-.*\.php$ {
            try_files $uri /index.php$is_args$args;
            expires 30d;
            add_header Pragma public;
            add_header Cache-Control "public";
            log_not_found off;
        }

        set $CDN_ROOT "/var/www/uprzejmiedonosze.net";
        location ^~ /cdn/ {
            try_files $uri =404;
            root $CDN_ROOT;
        }
        location ^~ /cdn2/ {
            try_files $uri @b2;
            access_log off;
            expires max;
            root $CDN_ROOT;
        }
        location ^~ /cdn2stg/ {
            try_files $uri @b2;
            root $CDN_ROOT;
            expires max;
            access_log off;
        }
        location @b2 {
            proxy_intercept_errors on;
            proxy_pass https://b2_v4;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host uprzejmiedonosze.s3.eu-central-003.backblazeb2.com;
            proxy_ssl_server_name on;
            proxy_ssl_name     uprzejmiedonosze.s3.eu-central-003.backblazeb2.com;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_ignore_client_abort on;

            expires            max;
            add_header         Cache-Control "public, immutable";
            access_log         off;
        }

        location ^~ /img/ {
            try_files $uri =404;
            access_log off;
        }

        location = /apple-touch-icon-120x120.png {
            return 301 /img/apple-touch-icon-120x120.png;
        }
        location = /apple-touch-icon.png {
            return 301 /img/apple-touch-icon.png;
        }
        location = /apple-touch-icon-120x120-precomposed.png {
            return 301 /img/apple-touch-icon-120x120.png;
        }
        location = /apple-touch-icon-precomposed.png {
            return 301 /img/apple-touch-icon.png;
        }

        location ~ ^/api/app/[^/]+/image$ {
            # No client_max_body_size here on purpose — see the server-level
            # one above for why a location-level value here would be a
            # silent no-op (try_files's internal redirect to /index.php
            # re-matches location, so the ~ \.php$ block's value is what
            # actually gets enforced, not this one).
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/api/rest {
            try_files $uri $uri/ /api/rest/index.php$is_args$args;
                location ~ \.php$ {
                    include nginx_php_configuration.conf;
                }
            }

        location = /mcp {
            try_files $uri $mcp_index$is_args$args;
        }

        # Browser consent screen is served by the main app (needs Firebase
        # login + Twig); the machine endpoints (register/token/revoke and
        # the well-known discovery docs) go to the OAuth entry. The exact
        # match below takes priority over the regex, carving /oauth/authorize
        # back out to the main app.
        location = /oauth/authorize {
            try_files $uri /index.php$is_args$args;
        }
        location ~ ^/(oauth/|\.well-known/oauth-) {
            try_files $uri /api/oauth/index.php$is_args$args;
        }

        # wiki.uprzejmiedonosze.net's own Caddy, reverse-proxied under /wiki/
        # on this vhost — same host it runs on standalone (Host header must
        # match, hence the fixed Host/SNI below rather than $host).
        #
        # $scheme is always "http" in here now — this container never
        # terminates TLS itself (Traefik does, on the `edge` network), so
        # nginx's own scheme is meaningless for anything forwarded onward.
        # Use $http_x_forwarded_proto (Traefik already sets this correctly
        # on every request it forwards) instead — confirmed 2026-09-27: with
        # $scheme, the wiki backend's session cookie was missing `Secure`
        # even over a real HTTPS visit, because it saw X-Forwarded-Proto:
        # http. Falls back to $scheme (empty $http_x_forwarded_proto) so
        # this still works if ever hit directly without Traefik in front
        # (e.g. dev).
        location ^~ /wiki/ {
            proxy_pass https://wiki.uprzejmiedonosze.net;
            proxy_ssl_server_name on;
            proxy_ssl_name wiki.uprzejmiedonosze.net;

            proxy_set_header Host wiki.uprzejmiedonosze.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

            proxy_redirect off;
        }
        location = /wiki {
            return 301 $proxy_x_forwarded_proto://$host/wiki/;
        }
    }
}
