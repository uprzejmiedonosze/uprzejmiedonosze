[app]
    name = uprzejmiedonosze
    metrics = uprzejmiedonosze.*
    private charts = no
    gaps when not collected = no
    update every = 300

# Wykres 1: Ruch i konwersja (wejścia, start, wysyłka)
[uprzejmiedonosze_traffic]
    name = traffic
    title = Ruch w aplikacji
    family = ruch
    context = uprzejmiedonosze.traffic
    units = zdarzeń/h
    type = line
    dimension = uprzejmiedonosze.visitor_entry entry "Wizyty na stronie" 1 1
    dimension = uprzejmiedonosze.report_started started "Rozpoczęte zgłoszenia" 1 1
    dimension = uprzejmiedonosze.report_sent sent "Wysłane zgłoszenia" 1 1
    dimension = uprzejmiedonosze.report_finished finished "Zakończone procesy" 1 1

# Wykres 2: Aktywność użytkowników (logowania)
[uprzejmiedonosze_users]
    name = users
    title = Aktywność logowania
    family = użytkownicy
    context = uprzejmiedonosze.users
    units = zdarzeń/h
    type = line
    dimension = uprzejmiedonosze.user_login login "Zalogowano" 1 1
    dimension = uprzejmiedonosze.user_logout logout "Wylogowano" 1 1

# Wykres 3: Błędy wewnętrzne aplikacji (pogrupowane po źródle)
[uprzejmiedonosze_app_errors]
    name = app_errors
    title = Błędy aplikacji
    family = błędy
    context = uprzejmiedonosze.app_errors
    units = błędów/h
    type = stacked
    dimension = pattern:uprzejmiedonosze.app_error.* '' '' 1 1

# Wykres 4: Statusy dostarczania maili (Mailgun)
[uprzejmiedonosze_delivery]
    name = delivery
    title = Statusy dostarczania (Mailgun)
    family = maile
    context = uprzejmiedonosze.delivery
    units = statusów/h
    type = stacked
    dimension = pattern:uprzejmiedonosze.delivery_status.* '' '' 1 1

# Wykres 5: Komunikacja z zewnętrznymi API (np. PlateRecognizer)
[uprzejmiedonosze_api]
    name = external_apis
    title = Błędy i ponowienia zewnętrznych API
    family = api
    context = uprzejmiedonosze.external_apis
    units = zdarzeń/h
    type = line
    dimension = uprzejmiedonosze.api_error errors "Błędy" 1 1
    dimension = uprzejmiedonosze.api_retry retries "Ponowienia (Retries)" 1 1

# Wykres 6: API geolokalizacji (Nominatim, MapBox, Google Maps)
[uprzejmiedonosze_api_geo]
    name = api_geo
    title = API geolokalizacji
    family = api
    context = uprzejmiedonosze.api_geo
    units = wywołań/h
    type = stacked
    dimension = uprzejmiedonosze.api_nominatim.success nominatim_ok "Nominatim OK" 1 1
    dimension = uprzejmiedonosze.api_nominatim.error nominatim_err "Nominatim błąd" 1 1
    dimension = uprzejmiedonosze.api_mapbox.success mapbox_ok "MapBox OK" 1 1
    dimension = uprzejmiedonosze.api_mapbox.error mapbox_err "MapBox błąd" 1 1
    dimension = uprzejmiedonosze.api_googlemaps.success googlemaps_ok "Google Maps OK" 1 1
    dimension = uprzejmiedonosze.api_googlemaps.error googlemaps_err "Google Maps błąd" 1 1

# Wykres 7: API rozpoznawania tablic (PlateRecognizer, OpenALPR)
[uprzejmiedonosze_api_plates]
    name = api_plates
    title = API rozpoznawania tablic
    family = api
    context = uprzejmiedonosze.api_plates
    units = wywołań/h
    type = stacked
    dimension = uprzejmiedonosze.api_platerecognizer.success platerecognizer_ok "PlateRecognizer OK" 1 1
    dimension = uprzejmiedonosze.api_platerecognizer.error platerecognizer_err "PlateRecognizer błąd" 1 1
    dimension = uprzejmiedonosze.api_openalpr.success openalpr_ok "OpenALPR OK" 1 1
    dimension = uprzejmiedonosze.api_openalpr.error openalpr_err "OpenALPR błąd" 1 1

# Wykres 8: API email i Patronite
[uprzejmiedonosze_api_services]
    name = api_services
    title = API email i Patronite
    family = api
    context = uprzejmiedonosze.api_services
    units = wywołań/h
    type = stacked
    dimension = uprzejmiedonosze.api_email.success email_ok "MailGun OK" 1 1
    dimension = uprzejmiedonosze.api_email.error email_err "MailGun błąd" 1 1
    dimension = uprzejmiedonosze.api_patronite.success patronite_ok "Patronite OK" 1 1
    dimension = uprzejmiedonosze.api_patronite.error patronite_err "Patronite błąd" 1 1

# Wykres 9: Edycje zgłoszeń
[uprzejmiedonosze_edits]
    name = report_edits
    title = Edycje zgłoszeń
    family = ruch
    context = uprzejmiedonosze.report_edits
    units = zdarzeń/h
    type = stacked
    dimension = uprzejmiedonosze.report_edited.image edits_image "Zdjęcia" 1 1
    dimension = uprzejmiedonosze.report_edited.fields edits_fields "Pola tekstowe" 1 1

# Wykres 10: Zadania CRON
[uprzejmiedonosze_cron]
    name = cron
    title = Zadania CRON
    family = system
    context = uprzejmiedonosze.cron
    units = uruchomień/h
    type = line
    dimension = uprzejmiedonosze.cron_s3_sync.success s3_sync "S3 sync" 1 1
    dimension = uprzejmiedonosze.cron_cleanup.success cleanup "Cleanup" 1 1
    dimension = uprzejmiedonosze.cron_old_users_removal.success old_users "Usunięcie starych użytkowników" 1 1

# Wykres 11: Operacje S3 (PUT upload, GET download)
[uprzejmiedonosze_s3]
    name = s3
    title = Operacje S3
    family = storage
    context = uprzejmiedonosze.s3
    units = operacji/h
    type = stacked
    dimension = uprzejmiedonosze.s3_put.success put_ok "PUT sukces" 1 1
    dimension = uprzejmiedonosze.s3_put.failed put_fail "PUT błąd" 1 1
    dimension = uprzejmiedonosze.s3_get.success get_ok "GET sukces" 1 1
    dimension = uprzejmiedonosze.s3_get.failed get_fail "GET błąd" 1 1
