# Godziny ciszy: 23:00–09:00 CEST = 21:00–07:00 UTC (zakładamy serwer w UTC)
# Warunek aktywności: ($hh >= 7) && ($hh < 21)

alarm: ud_started_4h
on: uprzejmiedonosze.traffic
class: Errors
type: Application
component: Conversion
lookup: sum -4h of started
every: 1m

alarm: ud_conversion_drop
on: uprzejmiedonosze.traffic
class: Errors
type: Application
component: Conversion
lookup: sum -4h of sent
calc: ($ud_started_4h >= 5) ? ($this * 100 / $ud_started_4h) : 100
every: 1m
warn: (($hh >= 7) && ($hh < 21)) ? ($this < 50) : 0
crit: (($hh >= 7) && ($hh < 21)) ? ($this < 20) : 0
units: %
info: Spadek konwersji z okna 4h

alarm: ud_entry_4h
on: uprzejmiedonosze.traffic
class: Errors
type: Application
component: Conversion
lookup: sum -4h of entry
every: 1m

alarm: ud_funnel_drop
on: uprzejmiedonosze.traffic
class: Errors
type: Application
component: Conversion
lookup: sum -4h of started
calc: ($ud_entry_4h >= 5) ? ($this * 100 / $ud_entry_4h) : 100
every: 1m
warn: (($hh >= 7) && ($hh < 21)) ? ($this < 25) : 0
crit: (($hh >= 7) && ($hh < 21)) ? ($this < 10) : 0
units: %
info: Spadek konwersji rozpoczecia formularza (started do entry) z okna 4 godzin


alarm: ud_nominatim_errors
on: uprzejmiedonosze.api_nominatim
class: Errors
type: Application
component: API
lookup: sum -15m of error
every: 1m

alarm: ud_nominatim_total
on: uprzejmiedonosze.api_nominatim
class: Errors
type: Application
component: API
lookup: sum -15m of success,error
every: 1m

alarm: ud_nominatim_error_rate
on: uprzejmiedonosze.api_nominatim
class: Errors
type: Application
component: API
calc: ($ud_nominatim_total >= 5) ? ($ud_nominatim_errors * 100 / $ud_nominatim_total) : 0
every: 1m
warn: (($hh >= 7) && ($hh < 21)) ? ($this > 30) : 0
units: %
info: API Nominatim - odsetek bledow powyzej 30 proc w ciagu 15 min

